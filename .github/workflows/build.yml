name: Build Windows EXE

# 触发规则
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 支持手动触发打包

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 拉取代码
      - name: Checkout source code
        uses: actions/checkout@v4

      # 配置Python3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"  # 缓存pip包，加速构建

      # 安装所有依赖 + pyinstaller
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # PyInstaller打包（所有参数写在一行 / 使用yml > 多行写法，不会断裂）
      - name: PyInstaller build exe
        run: >
          pyinstaller
          --clean
          --windowed
          --onefile
          --name "物料图片匹配系统"
          --add-data "matching.py;."
          --hidden-import openpyxl
          --hidden-import openpyxl.cell._writer
          --hidden-import PIL
          --hidden-import PIL.Image
          --hidden-import PIL.ImageTk
          --hidden-import jieba
          --hidden-import jieba.posseg
          --hidden-import jieba.analyse
          --hidden-import customtkinter
          app_ctk.py

      # 上传打包产物
      - name: Upload built exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: 物料图片匹配系统-Windows
          path: dist/物料图片匹配系统.exe
          retention-days: 30  # 产物保留30天
