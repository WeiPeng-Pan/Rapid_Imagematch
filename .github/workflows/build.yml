name: Build Windows EXE  
on:
    push:
      tags:
        - 'v*'
    workflow_dispatch:

  jobs:
    build:
      runs-on: windows-latest
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
            cache: 'pip'

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pyinstaller

        - name: PyInstaller build exe
          run: >
            pyinstaller
            --clean
            --windowed
            --onefile
            --name "Rapid_Imagematch"
            --hidden-import matching
            --hidden-import openpyxl
            --hidden-import openpyxl.cell._writer
            --hidden-import PIL
            --hidden-import PIL.Image
            --hidden-import PIL.ImageTk
            --hidden-import jieba
            --hidden-import jieba.posseg
            --hidden-import jieba.analyse
            --hidden-import customtkinter
            app_ctk.py

        - name: List dist output
          run: dir dist\

        - uses: actions/upload-artifact@v4
          with:
            name: Rapid_Imagematch-Windows
            path: dist/Rapid_Imagematch.exe
            retention-days: 30
